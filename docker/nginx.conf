# Site vitrine TPS Arena + app mobile (/app/, /api/) sans certificat : tout en HTTP.
# L'app s'ouvre mais ne s'installe pas et la session ne survit pas à un rechargement (le
# navigateur refuse le cookie Secure en HTTP). Avec un certificat, nginx-https.conf est
# utilisé à la place (choix fait par 35-arena-tls.sh au démarrage).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/server-common.conf;

    include /etc/nginx/snippets/site-locations.conf;
    include /etc/nginx/snippets/app-locations.conf;
}
