# Site vitrine Arena TPS : fichiers statiques du build Vite, manifeste généré au
# démarrage, builds du jeu et captures montés en lecture seule depuis l'hôte.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Page d'accueil : toujours revalidée pour récupérer les nouveaux assets.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Assets versionnés par Vite (nom contenant un hash) : cache long.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Manifeste régénéré par le conteneur : jamais mis en cache.
    location = /manifest.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Builds du jeu : téléchargement forcé, jamais affichés dans le navigateur.
    location /releases/ {
        alias /srv/releases/;
        types { }
        default_type application/octet-stream;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        location ~ /\. { return 404; }
    }

    # Captures d'écran : revalidées pour suivre les remplacements de fichiers.
    location /screenshots/ {
        alias /srv/screenshots/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        location ~ /\. { return 404; }
    }
}
