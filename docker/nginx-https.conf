# Site vitrine TPS Arena + app mobile avec le certificat mkcert (certs/ sur l'hôte) :
# - HTTP (80) : la vitrine ; /app/ et /api/ redirigés vers HTTPS ;
# - HTTPS (443) : tout.
# Pas de HSTS : il s'appliquerait à toute l'adresse IP et casserait la vitrine en HTTP
# (port 8080) et le back du jeu (8000, 8002, 8005) dans les navigateurs.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/server-common.conf;

    include /etc/nginx/snippets/site-locations.conf;
    include /etc/nginx/snippets/app-redirect.conf;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    include /etc/nginx/snippets/server-common.conf;

    ssl_certificate /etc/nginx/certs/site.crt;
    ssl_certificate_key /etc/nginx/certs/site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1h;

    include /etc/nginx/snippets/site-locations.conf;
    include /etc/nginx/snippets/app-locations.conf;
}
