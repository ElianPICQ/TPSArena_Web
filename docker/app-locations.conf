# App mobile (PWA, build de vite.app.config.ts dans dist/app/), son API (/api/ → web-bff) et
# le WebSocket du chat (/ws → Real-time). @WEB_BFF@ et @REALTIME@ sont remplacés au démarrage
# par WEB_BFF_UPSTREAM et REALTIME_UPSTREAM (35-arena-tls.sh).

location = /app {
    return 301 /app/;
}

# Navigation par ancre : /app/ et ses fichiers. Le HTML est toujours revalidé.
location /app/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /app/index.html;
}

location /app/assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Service worker et manifeste : jamais gardés en cache HTTP, sinon les mises à jour de l'app
# n'arrivent pas.
location ~ ^/app/(sw\.js|registerSW\.js|workbox-[\w-]+\.js)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location = /app/app.webmanifest {
    types { }
    default_type application/manifest+json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# API de l'app : web-bff, sur le réseau Docker partagé tpsarena-web. Résolu à chaque requête
# (DNS de Docker) : nginx démarre même si le back est arrêté ; seule /app/ affiche alors une erreur.
location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_bff @WEB_BFF@;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$web_bff;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Écrasé (pas complété) : un joueur ne peut pas y glisser une fausse adresse. Le web-bff le
    # transmet à Auth pour ses limites par IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    error_page 502 503 504 = @web_bff_unavailable;
}

# Chat et présence : WebSocket de Real-time (même protocole que le jeu, PROTOCOL.md), sur le
# réseau tpsarena-web. Le client envoie un heartbeat toutes les 20 s : 120 s sans rien = coupé.
location = /ws {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $realtime @REALTIME@;
    proxy_pass http://$realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location @web_bff_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"web_bff_unavailable","message":"The web BFF is unavailable."}';
}
