# HTTP alors que HTTPS est actif : l'app et son API passent en HTTPS (service worker,
# installation et cookie Secure l'exigent). La vitrine reste en HTTP, pour les PC qui n'ont
# pas la CA locale. @HTTPS_PORT@ est remplacé au démarrage par SITE_HTTPS_PORT.
location = /app {
    return 301 https://$host:@HTTPS_PORT@/app/;
}
location /app/ {
    return 301 https://$host:@HTTPS_PORT@$request_uri;
}
location /api/ {
    return 308 https://$host:@HTTPS_PORT@$request_uri;
}
# Le chat n'existe qu'en wss:// (le cookie et le jeton ne passent pas en clair).
location = /ws {
    return 403;
}
