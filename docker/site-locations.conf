# Vitrine : servie en HTTP et, si un certificat est présent, aussi en HTTPS.
# Inclus dans chaque bloc server (voir 35-arena-tls.sh).

# Page d'accueil : toujours revalidée pour récupérer les nouveaux assets.
location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}

# Assets versionnés par Vite (nom contenant un hash) : cache long.
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Manifeste régénéré par le conteneur : jamais mis en cache.
location = /manifest.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

# Builds du jeu : téléchargement forcé, jamais affichés dans le navigateur.
location /releases/ {
    alias /srv/releases/;
    types { }
    default_type application/octet-stream;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "no-cache" always;
    location ~ /\. { return 404; }
}

# Captures d'écran : revalidées pour suivre les remplacements de fichiers.
location /screenshots/ {
    alias /srv/screenshots/;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    location ~ /\. { return 404; }
}

# Certificat public de la CA locale (mkcert), à installer une fois sur les téléphones pour
# ouvrir l'app en HTTPS. Présent seulement si scripts/certificat.sh a été lancé. Jamais la clé.
location = /ca.crt {
    alias /etc/nginx/certs/tps-arena-ca.crt;
    # Absent en HTTP seul : la vitrine le teste (HEAD), inutile de le noter dans les journaux.
    log_not_found off;
    types { }
    default_type application/x-x509-ca-cert;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Disposition 'attachment; filename="tps-arena-ca.crt"' always;
    add_header Cache-Control "no-cache" always;
}
