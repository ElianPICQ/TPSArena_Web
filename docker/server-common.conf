# Réglages communs aux blocs server (HTTP et HTTPS).
root /usr/share/nginx/html;
index index.html;
charset utf-8;
server_tokens off;
# Redirections relatives : nginx écoute sur 80/443 dans le conteneur, mais l'hôte publie
# d'autres ports (8080/8443). Une redirection absolue enverrait vers le mauvais port.
absolute_redirect off;

sendfile on;
tcp_nopush on;

gzip on;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
gzip_min_length 1024;
